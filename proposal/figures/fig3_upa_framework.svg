<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="179mm" height="68mm" viewBox="0 0 179 68" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Overall framework of the proposed geometry-aware UPA channel foundation model</title>
