[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wifo-upa"
version = "0.1.0"
description = "UPA-aware extension of WiFo for CSI prediction"
requires-python = ">=3.9"
dependencies = [
  "h5py>=3.10",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
